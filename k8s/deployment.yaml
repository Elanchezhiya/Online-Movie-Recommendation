apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinematch-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cinematch-backend
  template:
    metadata:
      labels:
        app: cinematch-backend
    spec:
      containers:
        - name: backend
          image: "${DOCKERHUB_USERNAME}/cinematch-backend:1.0"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cinematch-backend
spec:
  type: ClusterIP
  selector:
    app: cinematch-backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinematch-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cinematch-frontend
  template:
    metadata:
      labels:
        app: cinematch-frontend
    spec:
      containers:
        - name: frontend
          image: "${DOCKERHUB_USERNAME}/cinematch-frontend:1.0"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cinematch-frontend
spec:
  type: ClusterIP
  selector:
    app: cinematch-frontend
  ports:
    - port: 80
      targetPort: 80
